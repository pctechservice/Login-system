<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <!-- Botão para abrir o menu hambúrguer -->
    <button id="menubtn">
        <i class="fa-solid fa-bars"></i>
    </button>

    <!-- Overlay escuro de fundo -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Menu Lateral (Sidebar) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button id="closeSidebar">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <nav class="sidebar_nav">
            <a href="pagina-perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
            <a href="configuracoes.html"><i class="fa-solid fa-gear"></i> Configurações</a>
            <a href="ajuda.html"><i class="fa-solid fa-circle-info"></i> Ajuda</a>
            <a href="login.html" class="menu-sair"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
        </nav>

        <div class="sidebar-footer" id="usuarioSidebar">
            <div class="user_avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-info">
                <span class="user-name" id="nomeUsuario">John Doe</span>
                <span class="user-email" id="emailUsuario">john.doe@example.com</span>
            </div>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="boas-vindas">
        <div class="card">
            <div class="avatar">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Criar perfil</h1>
            <p class="subtitulo">Preencha seus dados para começar</p>

            <form class="formulario" id="formPerfil">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Seu nome">

                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" placeholder="Seu sobrenome">

                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Sua idade" min="1" max="120">

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Sua cidade">

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000">

                <button type="submit" class="btn-criar">Criar perfil</button>

                <a href="perfil.html" class="btn-voltar">
                    <i class="fa-solid fa-arrow-left"></i> Voltar
                </a>
            </form>
        </div>
    </main>

    <script src="criar-perfil.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
