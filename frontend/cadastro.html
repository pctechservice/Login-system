<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <div class="ilustracao-lado">
            <img src="img/Login-rafiki.png" alt="Ilustração">
        </div>

        <div class="form-lado">
            <h2>Cadastro</h2>
            <form>

                <div class="campo">
                    <label for="Nome">Nome</label>
                    <input type="text" id="Nome" name="Nome" placeholder="Digite seu nome">
                </div>

                <div class="campo">
                    <label for="EmailCadastro">Email</label>
                    <input type="email" id="EmailCadastro" name="EmailCadastro" placeholder="Digite seu email">
                </div>

                <div class="campo">
                    <label for="SenhaCadastro">Senha</label>
                    <input type="password" id="SenhaCadastro" name="SenhaCadastro" placeholder="Crie uma senha">
                </div>

                <button type="submit">Cadastrar</button>
            </form>

            <p class="cadastro-link">Já tem uma conta? <a href="login.html">Entrar</a></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
